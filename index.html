<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de tiempo — Boleto</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="boleto">

        <!-- Cuerpo principal del boleto: hora inicial, hora final y el botón -->
        <section class="cuerpo">

            <div class="encabezado">
                <span class="aerolinea">LÍNEA DEL TIEMPO</span>
                <span class="numero-vuelo">CÁLCULO N.º 001</span>
            </div>

            <div class="tramo">

                <div class="punto">
                    <span class="etiqueta">Hora inicial</span>
                    <div class="campos">
                        <input type="number" id="hi" min="0" max="23" placeholder="00" onchange="verificar('hi', 23)">
                        <span class="dospuntos">:</span>
                        <input type="number" id="mi" min="0" max="59" placeholder="00" onchange="verificar('mi', 59)">
                        <span class="dospuntos">:</span>
                        <input type="number" id="si" min="0" max="59" placeholder="00" onchange="verificar('si', 59)">
                    </div>
                </div>

                <div class="ruta" aria-hidden="true">
                    <svg viewBox="0 0 120 24" class="icono-avion">
                        <line x1="4" y1="12" x2="100" y2="12" stroke-dasharray="4 5"/>
                        <path d="M100 5 L116 12 L100 19 L103 12 Z" />
                    </svg>
                </div>

                <div class="punto">
                    <span class="etiqueta">Hora final</span>
                    <div class="campos">
                        <input type="number" id="hf" min="0" max="23" placeholder="00" onchange="verificar('hf', 23)">
                        <span class="dospuntos">:</span>
                        <input type="number" id="mf" min="0" max="59" placeholder="00" onchange="verificar('mf', 59)">
                        <span class="dospuntos">:</span>
                        <input type="number" id="sf" min="0" max="59" placeholder="00" onchange="verificar('sf', 59)">
                    </div>
                </div>

            </div>

            <button type="button" id="btnCalcular" class="boton-calcular">Calcular tiempo transcurrido</button>
            <p id="mensaje" class="mensaje"></p>

        </section>

        <!-- Talón del boleto: separado por la línea perforada, muestra el resultado -->
        <section class="talon">
            <span class="etiqueta-talon">Duración</span>

            <div class="resultado">
                <input type="number" id="hr" placeholder="00" readonly><span>h</span>
                <input type="number" id="mr" placeholder="00" readonly><span>m</span>
                <input type="number" id="sr" placeholder="00" readonly><span>s</span>
            </div>

            <div class="sello" id="sello">verificado</div>

            <div class="codigo-barras" aria-hidden="true"></div>
        </section>

    </main>

    <script src="codigo.js"></script>
</body>
</html>
